[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imageset-guard"
version = "0.1.0.dev0"
description = "Local preflight checks for image datasets before training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Mazen Abbas" },
]
keywords = ["dataset", "images", "preflight", "validation", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/MazenAbbas/imageset-guard"
Repository = "https://github.com/MazenAbbas/imageset-guard"
Issues = "https://github.com/MazenAbbas/imageset-guard/issues"

[project.scripts]
imageset-guard = "imageset_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imageset_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
